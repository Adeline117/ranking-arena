name: Public Data Freshness Probe

# WHY (2026-11 audit P0-1): the leaderboard stopped updating for over two
# months and nothing paged. Every monitor shared the pipeline's own kill
# switch (V1 constants / withCron 410 / workflow `if: false`) or ran on the
# worker host it was supposed to watch.
#
# This probe is deliberately independent of all of that:
#   - no Arena credential: it reads only the PUBLIC https://www.arenafi.org/api/health
#     with a plain GET (no auth header, no cookies);
#   - no checkout, no repository code, no third-party action: nothing from the
#     default branch executes except this inline shell;
#   - not gated by any V1 publication constant and not on the worker host.
# The only credentials are the job-scoped GITHUB_TOKEN, limited to `issues: write`,
# used to open/update/close ONE de-duplicated issue (no Telegram dependency),
# and the external dead-man ping URL (below), which grants nothing in Arena.
#
# Fails the run (GitHub emails the workflow owner) and opens/updates the issue when:
#   - /api/health is unreachable or returns non-2xx (stale data now returns 503), or
#   - the 90D publication watermark (checks.freshness.details.latestSuccessfulPublicationAt)
#     is missing or older than MAX_PUBLICATION_AGE_HOURS, or
#   - checks.freshness.status is not "pass".
# Self-heals: the issue is closed on the first healthy run.
#
# Dead-man switch (audit P0-1 / S5-1): when the schedule never fires (Actions
# billing block, workflow disabled, GitHub's 60-day inactivity pause) nothing
# inside GitHub or arenafi.org can notice. Every run therefore ends by pinging
# an EXTERNAL heartbeat check (healthchecks.io-style `<url>/<exit code>`;
# 0 = healthy, non-zero = failing). That service — not GitHub, not the probed
# site — alerts the owner when pings stop. Owner setup: create a check with a
# 30 min period and ~60 min grace and store its ping URL as the repository
# secret FRESHNESS_PROBE_DEADMAN_URL. Without it every run warns.

on:
  schedule:
    - cron: '17,47 * * * *' # every 30 min, offset from other sentinels

permissions:
  issues: write

concurrency:
  group: public-freshness-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: 'https://www.arenafi.org/api/health'
      MAX_PUBLICATION_AGE_HOURS: '8'
      ISSUE_TITLE: '🛑 公开榜单数据停更(外部探针)'
    steps:
      - name: Probe public health and publication watermark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEADMAN_PING_URL: ${{ secrets.FRESHNESS_PROBE_DEADMAN_URL }}
        run: |
          set -uo pipefail

          ping_deadman() {
            local code="$1"
            if [ -z "${DEADMAN_PING_URL:-}" ]; then
              echo "::warning::FRESHNESS_PROBE_DEADMAN_URL not set — a probe that stops running goes unnoticed"
              return
            fi
            curl --silent --show-error --fail --max-time 10 --retry 2 --output /dev/null \
              "${DEADMAN_PING_URL%/}/${code}" \
              || echo "::warning::dead-man ping failed"
          }
          trap 'ping_deadman "$?"' EXIT

          find_open_issue() {
            gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
              --limit 50 --json number,title 2>/dev/null \
              | jq -r --arg title "$ISSUE_TITLE" '.[] | select(.title == $title) | .number' \
              | head -1
          }

          report_problem() {
            local message="$1"
            local body number
            echo "::error::$message"
            echo "### $message" >> "$GITHUB_STEP_SUMMARY"
            body="${message}"$'\n\n'"最近一次探测: $(date -u +%FT%TZ)"$'\n'"探测目标: ${HEALTH_URL} (GET, 无鉴权)"$'\n\n'"由 public-freshness-probe 工作流自动维护;恢复后自动关闭。"
            number=$(find_open_issue || true)
            if [ -n "$number" ]; then
              # Edit in place instead of commenting every 30 min (no notification spam).
              gh issue edit "$number" --body "$body" >/dev/null 2>&1 \
                || echo "::warning::could not update freshness issue #$number"
            elif ! gh issue create --title "$ISSUE_TITLE" --body "$body" >/dev/null 2>&1; then
              echo "::warning::could not create freshness issue"
            fi
            exit 1
          }

          rm -f /tmp/health.json
          CURL_EXIT=0
          HTTP=$(curl --silent --show-error --request GET \
            --connect-timeout 10 --max-time 30 --max-redirs 0 --max-filesize 1048576 \
            --header 'Accept: application/json' \
            --output /tmp/health.json --write-out '%{http_code}' \
            "${HEALTH_URL}?probe=$(date -u +%s)") || CURL_EXIT=$?
          echo "health: curl=$CURL_EXIT HTTP=${HTTP:-000}"

          STATUS=$(jq -r '.status // "missing"' /tmp/health.json 2>/dev/null || echo unreadable)
          FRESHNESS=$(jq -r '.checks.freshness.status // "missing"' /tmp/health.json 2>/dev/null || echo unreadable)
          FRESH_MSG=$(jq -r '.checks.freshness.message // ""' /tmp/health.json 2>/dev/null | head -c 300 || true)
          PUBLISHED_AT=$(jq -r '.checks.freshness.details.latestSuccessfulPublicationAt // empty' /tmp/health.json 2>/dev/null || true)
          echo "status=$STATUS freshness=$FRESHNESS publishedAt=${PUBLISHED_AT:-missing}"

          if [ "$CURL_EXIT" -ne 0 ] || [[ "${HTTP:-000}" != 2* ]]; then
            report_problem "公开 /api/health 非 2xx(curl=$CURL_EXIT HTTP=${HTTP:-000} status=$STATUS freshness=$FRESHNESS)。${FRESH_MSG}"
          fi
          if [ "$FRESHNESS" != "pass" ]; then
            report_problem "公开新鲜度检查未通过(freshness=$FRESHNESS)。${FRESH_MSG}"
          fi
          if [ -z "$PUBLISHED_AT" ]; then
            report_problem "公开 90D 发布水位缺失(latestSuccessfulPublicationAt 为空)。"
          fi
          PUBLISHED_EPOCH=$(jq -rn --arg t "$PUBLISHED_AT" \
            '$t | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601' 2>/dev/null || echo "")
          if [ -z "$PUBLISHED_EPOCH" ]; then
            report_problem "公开 90D 发布水位无法解析(${PUBLISHED_AT})。"
          fi
          AGE_HOURS=$(( ( $(date -u +%s) - PUBLISHED_EPOCH ) / 3600 ))
          echo "publication age: ${AGE_HOURS}h (max ${MAX_PUBLICATION_AGE_HOURS}h)"
          if [ "$AGE_HOURS" -gt "$MAX_PUBLICATION_AGE_HOURS" ]; then
            report_problem "公开 90D 榜单已 ${AGE_HOURS} 小时未发布(阈值 ${MAX_PUBLICATION_AGE_HOURS}h,最后发布 ${PUBLISHED_AT})。"
          fi

          echo "✅ public data fresh (publication ${AGE_HOURS}h old)"
          number=$(find_open_issue || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "✅ 已恢复:最后发布 ${PUBLISHED_AT}(${AGE_HOURS}h 前)。自动关闭。" >/dev/null 2>&1 \
              || echo "::warning::could not comment on freshness issue #$number"
            gh issue close "$number" >/dev/null 2>&1 \
              || echo "::warning::could not close freshness issue #$number"
          fi
