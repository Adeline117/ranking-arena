name: Deploy Ingest Worker (SG)

# SG receives a Linux-x64 dependency tree built on Node 22. Every run is an
# explicit deployment of one full commit that must still be origin/main before
# and after the remote cutover. The artifact manifest is verified independently
# in the deploy job; it is never sourced as shell code.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character lowercase main commit to deploy'
        required: true
        type: string
      mode:
        description: 'full (rebuild + ship deps) or code-only (reuse validated SG deps)'
        required: true
        type: choice
        options: [full, code-only]
        default: full

permissions:
  contents: read

concurrency:
  group: deploy-ingest-sg
  cancel-in-progress: false

jobs:
  build-deps:
    # A code-only deployment reuses the dependency tree checked by the remote
    # deploy script, so this intentionally reports "skipped" in that mode.
    if: ${{ inputs.mode != 'code-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate the requested deployment identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::target_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          }

      - name: Check out the exact target commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Guard target is the current origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          [ "$HEAD_SHA" = "$TARGET_SHA" ] || {
            echo "::error::checkout mismatch: expected exact target_sha"
            exit 1
          }
          [ "$MAIN_SHA" = "$TARGET_SHA" ] || {
            echo "::error::target_sha is no longer current origin/main; dispatch the new main SHA"
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Must match the SG runtime. The deploy job also checks the live host.
          node-version: '22'
          cache: 'npm'

      - name: npm ci (deterministic, full)
        run: npm ci

      - name: Verify dependency tree resolves and loads
        shell: bash
        run: |
          set -euo pipefail
          for module in bullmq ioredis viem abitype luxon @supabase/supabase-js pg ccxt \
                        playwright tsx dotenv esbuild; do
            node -e "require.resolve('$module')" || {
              echo "::error::dependency tree is incomplete: $module is unresolved"
              exit 1
            }
          done
          npx tsx --eval "
            (async () => {
              const modules = ['bullmq','ioredis','pg','ccxt','viem','abitype','luxon','@supabase/supabase-js','dotenv','esbuild','playwright'];
              for (const module of modules) {
                try { await import(module); }
                catch (error) {
                  console.error('::error::dependency failed to load: '+module+': '+String(error && (error.stack||error.message||error)));
                  process.exit(1);
                }
              }
            })();
          "

      - name: Package dependencies and write the bound manifest
        shell: bash
        run: |
          set -euo pipefail
          WORKER_RELEASE_ID="$(node scripts/ci/worker-release-id.mjs "$TARGET_SHA")"
          [[ "$WORKER_RELEASE_ID" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::worker release helper returned a malformed ID"
            exit 1
          }

          DEP_INPUTS_SHA256="$({ sha256sum .npmrc package.json package-lock.json; } | sha256sum | awk '{print $1}')"
          NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          ARCH="$(node -p 'process.arch')"
          [ "$NODE_MAJOR" = '22' ] && [ "$ARCH" = 'x64' ] || {
            echo "::error::artifact must be built with Node 22 on Linux x64"
            exit 1
          }

          tar -czf arena-ingest-deps.tgz node_modules
          tar -tzf arena-ingest-deps.tgz >/dev/null
          TARBALL_SHA256="$(sha256sum arena-ingest-deps.tgz | awk '{print $1}')"

          # Values are constrained hashes/digits/architecture identifiers. The
          # consumer still parses this as data and never shell-sources it.
          printf '%s\n' \
            "TARGET_SHA=$TARGET_SHA" \
            "WORKER_RELEASE_ID=$WORKER_RELEASE_ID" \
            "DEP_INPUTS_SHA256=$DEP_INPUTS_SHA256" \
            "NODE_MAJOR=$NODE_MAJOR" \
            "ARCH=$ARCH" \
            "TARBALL_SHA256=$TARBALL_SHA256" \
            > arena-ingest-deps.manifest

      - name: Upload dependency artifact and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arena-ingest-deps-${{ inputs.target_sha }}
          path: |
            arena-ingest-deps.tgz
            arena-ingest-deps.manifest
          if-no-files-found: error
          retention-days: 3

  deploy-sg:
    needs: [build-deps]
    # A skipped build is valid only for code-only. Full mode must prove that the
    # build job succeeded before this job can reach any remote mutation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ingest-sg-production
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
    steps:
      - name: Validate dispatch and dependency-build outcome
        env:
          BUILD_DEPS_RESULT: ${{ needs.build-deps.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::target_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          }
          [ "$GITHUB_REF" = 'refs/heads/main' ] && [ "$GITHUB_SHA" = "$TARGET_SHA" ] || {
            echo "::error::production deployment workflow must itself run from the exact target on main"
            exit 1
          }
          case "$DEPLOY_MODE:$BUILD_DEPS_RESULT" in
            full:success|code-only:skipped) ;;
            *)
              echo "::error::invalid build-deps outcome for mode ($DEPLOY_MODE:$BUILD_DEPS_RESULT)"
              exit 1
              ;;
          esac

      - name: Check out the exact target commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Guard target is current origin/main at deploy-job start
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          [ "$HEAD_SHA" = "$TARGET_SHA" ] || {
            echo "::error::checkout mismatch: expected exact target_sha"
            exit 1
          }
          [ "$MAIN_SHA" = "$TARGET_SHA" ] || {
            echo "::error::target_sha is no longer current origin/main"
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Require all SG SSH trust inputs
        env:
          INGEST_SG_SSH_KEY: ${{ secrets.INGEST_SG_SSH_KEY }}
          INGEST_SG_HOST: ${{ secrets.INGEST_SG_HOST }}
          INGEST_SG_KNOWN_HOSTS: ${{ secrets.INGEST_SG_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$INGEST_SG_SSH_KEY" ] || { echo "::error::INGEST_SG_SSH_KEY is required"; exit 1; }
          [ -n "$INGEST_SG_HOST" ] || { echo "::error::INGEST_SG_HOST is required"; exit 1; }
          [ -n "$INGEST_SG_KNOWN_HOSTS" ] || { echo "::error::INGEST_SG_KNOWN_HOSTS is required"; exit 1; }
          [[ "$INGEST_SG_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*@[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "::error::INGEST_SG_HOST must be a fixed user@hostname value"
            exit 1
          }

      - name: Download the exact dependency artifact
        if: ${{ inputs.mode == 'full' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arena-ingest-deps-${{ inputs.target_sha }}

      - name: Recompute and verify the artifact manifest independently
        if: ${{ inputs.mode == 'full' }}
        id: artifact_attestation
        shell: bash
        run: |
          set -euo pipefail
          test -f arena-ingest-deps.tgz
          test -f arena-ingest-deps.manifest
          tar -tzf arena-ingest-deps.tgz >/dev/null

          export EXPECTED_TARGET_SHA="$TARGET_SHA"
          export EXPECTED_WORKER_RELEASE_ID="$(node scripts/ci/worker-release-id.mjs "$TARGET_SHA")"
          export EXPECTED_DEP_INPUTS_SHA256="$({ sha256sum .npmrc package.json package-lock.json; } | sha256sum | awk '{print $1}')"
          export EXPECTED_NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          export EXPECTED_ARCH="$(node -p 'process.arch')"
          export EXPECTED_TARBALL_SHA256="$(sha256sum arena-ingest-deps.tgz | awk '{print $1}')"

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const keys = [
            'TARGET_SHA',
            'WORKER_RELEASE_ID',
            'DEP_INPUTS_SHA256',
            'NODE_MAJOR',
            'ARCH',
            'TARBALL_SHA256',
          ]
          const raw = readFileSync('arena-ingest-deps.manifest', 'utf8')
          if (!raw.endsWith('\n')) throw new Error('artifact manifest must end with one newline')
          const lines = raw.slice(0, -1).split('\n')
          if (lines.length !== keys.length) throw new Error('artifact manifest key count is invalid')

          const manifest = new Map()
          for (const line of lines) {
            const match = /^([A-Z][A-Z0-9_]*)=([A-Za-z0-9._-]+)$/.exec(line)
            if (!match || manifest.has(match[1])) throw new Error('artifact manifest is malformed')
            manifest.set(match[1], match[2])
          }
          if (keys.some((key) => !manifest.has(key)) || [...manifest.keys()].some((key) => !keys.includes(key))) {
            throw new Error('artifact manifest contains missing or unknown keys')
          }

          const expected = {
            TARGET_SHA: process.env.EXPECTED_TARGET_SHA,
            WORKER_RELEASE_ID: process.env.EXPECTED_WORKER_RELEASE_ID,
            DEP_INPUTS_SHA256: process.env.EXPECTED_DEP_INPUTS_SHA256,
            NODE_MAJOR: process.env.EXPECTED_NODE_MAJOR,
            ARCH: process.env.EXPECTED_ARCH,
            TARBALL_SHA256: process.env.EXPECTED_TARBALL_SHA256,
          }
          const formats = {
            TARGET_SHA: /^[0-9a-f]{40}$/,
            WORKER_RELEASE_ID: /^[0-9a-f]{64}$/,
            DEP_INPUTS_SHA256: /^[0-9a-f]{64}$/,
            NODE_MAJOR: /^22$/,
            ARCH: /^x64$/,
            TARBALL_SHA256: /^[0-9a-f]{64}$/,
          }
          for (const key of keys) {
            const value = manifest.get(key)
            if (!formats[key].test(value) || value !== expected[key]) {
              throw new Error(`artifact manifest mismatch: ${key}`)
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `node_major=${manifest.get('NODE_MAJOR')}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `arch=${manifest.get('ARCH')}\n`)
          NODE

      - name: Configure pinned SSH host trust
        env:
          INGEST_SG_SSH_KEY: ${{ secrets.INGEST_SG_SSH_KEY }}
          INGEST_SG_HOST: ${{ secrets.INGEST_SG_HOST }}
          INGEST_SG_KNOWN_HOSTS: ${{ secrets.INGEST_SG_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$INGEST_SG_SSH_KEY" > ~/.ssh/id_sg
          printf '%s\n' "$INGEST_SG_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_sg ~/.ssh/known_hosts

          hostname="${INGEST_SG_HOST#*@}"
          user="${INGEST_SG_HOST%@*}"
          ssh-keygen -F "$hostname" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::INGEST_SG_KNOWN_HOSTS has no pinned key for the configured hostname"
            exit 1
          }
          {
            printf 'Host %s\n' "$hostname"
            printf '  User %s\n' "$user"
            printf '  IdentityFile ~/.ssh/id_sg\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile ~/.ssh/known_hosts\n'
            printf '  ServerAliveInterval 20\n'
            printf '  ServerAliveCountMax 15\n'
            printf '  TCPKeepAlive yes\n'
            printf '  ConnectTimeout 20\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Verify live SG runtime matches the deployment contract
        env:
          INGEST_SG_HOST: ${{ secrets.INGEST_SG_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RUNTIME="$(ssh "$INGEST_SG_HOST" "node -p \"process.versions.node.split('.')[0] + ' ' + process.arch\"")"
          if [ "$DEPLOY_MODE" = 'full' ]; then
            EXPECTED_RUNTIME='${{ steps.artifact_attestation.outputs.node_major }} ${{ steps.artifact_attestation.outputs.arch }}'
          else
            EXPECTED_RUNTIME='22 x64'
          fi
          [ "$REMOTE_RUNTIME" = "$EXPECTED_RUNTIME" ] || {
            echo "::error::SG runtime does not match artifact contract (expected $EXPECTED_RUNTIME)"
            exit 1
          }

      - name: Recheck current origin/main immediately before deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ] || {
            echo "::error::working tree no longer identifies target_sha"
            exit 1
          }
          [ "$(git rev-parse refs/remotes/origin/main)" = "$TARGET_SHA" ] || {
            echo "::error::origin/main advanced before deployment; refusing stale cutover"
            exit 1
          }

      # deploy-ingest-sg.sh requires a fresh ready+heartbeat pair for this exact
      # release. While SSH and its token-fenced lease remain available, it also
      # auto-restores the previous release on failure. That is the executable SG
      # proof; this workflow intentionally makes no unverified cross-node claim.
      - name: Deploy and require fresh SG readiness evidence
        id: deploy
        env:
          INGEST_SG_HOST: ${{ secrets.INGEST_SG_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DEPLOY_MODE" = 'code-only' ]; then
            bash worker/deploy-ingest-sg.sh --target-sha="$TARGET_SHA" --code-only
          else
            bash worker/deploy-ingest-sg.sh \
              --target-sha="$TARGET_SHA" \
              --from-artifact="$PWD/arena-ingest-deps.tgz" \
              --artifact-manifest="$PWD/arena-ingest-deps.manifest"
          fi

      # The script's final exact-main check is inside its rollback transaction.
      # A commit arriving after that success point is a new rollout, not a
      # failed old rollout; report it without pretending the completed cutover
      # was rolled back.
      - name: Report if main advances after successful deployment
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ] || {
            echo "::error::post-deploy checkout identity changed"
            exit 1
          }
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$TARGET_SHA" ]; then
            echo "::warning::origin/main advanced after transactional success; evaluate the new main release"
          fi
