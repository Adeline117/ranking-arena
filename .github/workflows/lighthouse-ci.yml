name: Lighthouse CI

on:
  pull_request:
    branches: [main]

# PR code is untrusted. It may build and start only against inert placeholders;
# production Supabase credentials must never enter this job. The token used by
# no privileged action or write token is introduced after repository-controlled
# commands, because a hostile PR can leave a same-user background process alive.
permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-placeholder
  SUPABASE_URL: https://placeholder.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-build-service-placeholder
  # lib/env validates these in production. They are deliberately inert PR
  # placeholders, never repository secrets or production credentials.
  CRON_SECRET: ci-build-placeholder-cron-secret-0000000000
  UPSTASH_REDIS_REST_URL: http://127.0.0.1:9
  UPSTASH_REDIS_REST_TOKEN: ci-runtime-token-placeholder

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # The combined App Router graph exceeds V8's ~2 GiB default heap on
          # ubuntu-latest, as independently proven by the main CI Build job.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run Lighthouse CI
        run: |
          set -euo pipefail

          LHCI_PORT=3000
          export LHCI_ORIGIN="http://127.0.0.1:${LHCI_PORT}"
          SERVER_LOG="$RUNNER_TEMP/arena-lighthouse-server.log"
          node ./node_modules/next/dist/bin/next start \
            --hostname 127.0.0.1 \
            --port "$LHCI_PORT" >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          cleanup_server() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup_server EXIT INT TERM

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 \
              "$LHCI_ORIGIN/" >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Lighthouse server exited before readiness"
              tail -n 100 "$SERVER_LOG"
              exit 1
            fi
            echo "Waiting for server... ($attempt/30)"
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Lighthouse server did not become ready"
            tail -n 100 "$SERVER_LOG"
            exit 1
          fi

          for path in / /methodology /about; do
            curl --fail --silent --show-error --max-time 15 \
              "$LHCI_ORIGIN$path" >/dev/null
          done

          npx --no-install lhci collect
          npx --no-install lhci assert
