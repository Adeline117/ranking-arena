name: Lighthouse CI

on:
  # Stacked PRs must retain the same preview-build contract as main-bound PRs.
  pull_request:

permissions:
  contents: read

env:
  # Pull-request code must never receive production database credentials.
  # These values only satisfy build-time validation; Lighthouse exercises the
  # locally built application and does not need production data access.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: lighthouse-build-anon-placeholder
  SUPABASE_URL: https://placeholder.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: lighthouse-build-service-placeholder
  CRON_SECRET: lighthouse-build-placeholder-cron-secret-000000

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          # Match the production-build memory contract in the main CI workflow.
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: production

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Start server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Summarize Lighthouse results
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // Find the latest Lighthouse JSON results
            const resultsDir = '.lighthouseci';
            let results = [];

            try {
              const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.json') && !f.startsWith('manifest'));
              for (const file of files) {
                const data = JSON.parse(fs.readFileSync(`${resultsDir}/${file}`, 'utf8'));
                if (data.categories) {
                  results.push({
                    url: data.finalUrl || data.requestedUrl || 'unknown',
                    performance: Math.round((data.categories.performance?.score || 0) * 100),
                    accessibility: Math.round((data.categories.accessibility?.score || 0) * 100),
                    bestPractices: Math.round((data.categories['best-practices']?.score || 0) * 100),
                    seo: Math.round((data.categories.seo?.score || 0) * 100),
                  });
                }
              }
            } catch (e) {
              console.log('Could not parse Lighthouse results:', e.message);
            }

            if (results.length === 0) {
              console.log('No Lighthouse results found');
              return;
            }

            const emoji = (score, threshold) => score >= threshold ? '✅' : '❌';

            let body = '## Lighthouse CI Results\n\n';
            body += '| Page | Performance | Accessibility | Best Practices | SEO |\n';
            body += '|------|-------------|---------------|----------------|-----|\n';

            for (const r of results) {
              const shortUrl = r.url.replace('http://localhost:3000', '');
              body += `| ${shortUrl || '/'} `;
              body += `| ${emoji(r.performance, 50)} ${r.performance} `;
              body += `| ${emoji(r.accessibility, 80)} ${r.accessibility} `;
              body += `| ${emoji(r.bestPractices, 80)} ${r.bestPractices} `;
              body += `| ${r.seo} |\n`;
            }

            body += '\n**Thresholds:** Performance > 50, Accessibility > 80, Best Practices > 80\n';

            await core.summary.addRaw(body).write();

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: lighthouse-results
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 3
          include-hidden-files: true
