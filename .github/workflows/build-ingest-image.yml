name: Build Ingest Worker Image

# Builds the ingest-worker container (worker/Dockerfile.ingest), smoke-tests it on
# the runner, and only then pushes it to ghcr.io. Nothing deploys this image: the
# SG worker runs through the PM2 path, and container rollout stays disabled (see
# docs/INGEST_WORKER_DEPLOY.md). A future rollout must reference the pushed digest,
# not a tag.
#
# SECURITY SUSPENDED (V1 NO-GO): main currently has no enforceable protection,
# so a push must not hand repository code a packages:write token. The job is
# fixed false below. Restore only after main is protected and publication uses a
# protected tag/release or an environment-only gate with a required reviewer.

on:
  # These paths are the worker runtime inputs hashed by worker-release-id.mjs.
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.npmrc'
      - 'tsconfig.json'
      - 'scripts/ci/worker-release-id.mjs'
      - '.github/workflows/build-ingest-image.yml'
      - '.github/workflows/deploy-ingest-sg.yml'

concurrency:
  group: build-ingest-image
  cancel-in-progress: true

jobs:
  build-push:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release ID and image name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(node scripts/ci/worker-release-id.mjs "$GITHUB_SHA")"
          [[ "$release_id" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::malformed worker release ID"; exit 1; }
          # OCI repository names must be lowercase; GITHUB_REPOSITORY keeps display casing.
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/ingest-worker"
          printf 'release_id=%s\nimage=%s\n' "$release_id" "$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Built into the runner's local Docker only. Nothing reaches the registry
      # until the smoke step below has passed.
      - name: Build image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: worker/Dockerfile.ingest
          load: true
          push: false
          build-args: |
            DEPLOYED_SHA=${{ github.sha }}
            WORKER_RELEASE_ID=${{ steps.meta.outputs.release_id }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Runs before registry login, so image code never sees the packages token.
      - name: Smoke image — baked stamps + actual module loads
        shell: bash
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          DEPLOYED_SHA: ${{ github.sha }}
          WORKER_RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          baked_sha=$(docker run --rm --entrypoint cat "$IMAGE_REF" /app/DEPLOYED_SHA)
          [ "$baked_sha" = "$DEPLOYED_SHA" ] || { echo "::error::baked SHA stamp mismatch"; exit 1; }
          baked_release=$(docker run --rm --entrypoint cat "$IMAGE_REF" /app/WORKER_RELEASE_ID)
          [ "$baked_release" = "$WORKER_RELEASE_ID" ] || { echo "::error::baked release stamp mismatch"; exit 1; }
          docker run --rm --entrypoint node "$IMAGE_REF" --import tsx --input-type=module -e \
            "for (const m of ['bullmq','ioredis','viem','abitype','luxon','playwright','tsx','dotenv','pg','ccxt']) await import(m); await import('./worker/src/ingest/heartbeat.ts'); console.log('worker-modules-loaded')"
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push smoked image
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          WORKER_RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$WORKER_RELEASE_ID"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$WORKER_RELEASE_ID"
          digest_ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "Pushed \`$digest_ref\` (release \`$WORKER_RELEASE_ID\`)" >> "$GITHUB_STEP_SUMMARY"
