name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Per-SHA group, no cancel: 7 个并发会话高频直推 main，per-ref cancel-in-progress
# 会让每个 run 都被下一次 push 取消——CI 在忙碌时段永远跑不完（2026-07-02 差距
# 审计发现"CI 全红"的一半根因是 cancelled 而非 failure）。快速作业必须每个
# commit 跑完才能充当部署门禁；E2E 成本高，在 job 级单独设 per-ref cancel。
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_ENV: test

jobs:
  # PR 只证明本地 AST/fixture/脚本契约，完全不注入生产 secret，也不联网。
  # 生产漂移是下面独立的 push-main job；PR 中尚未部署的 migration 不应拿
  # 当前生产 schema 做 diff。
  types-contract:
    name: Types generation contract (offline, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run gen:types:contract

  # SECURITY SUSPENDED (V1 NO-GO): repository-level production secrets are not
  # a trust boundary against same-repository workflow edits. Restore only after
  # these values are environment-only behind a required reviewer and protected
  # main, then update Deploy Gate's required-job contract in the same change.
  types-live-drift:
    name: Types live drift check (push main only)
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Regenerate from attested production and diff
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Keep one credential in this process. New Supabase secret keys are
          # preferred; the legacy service-role value is only a compatibility
          # fallback and is exposed under the same env name.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run gen:types:check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "type generation attempt $attempt/3 failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          exit 1

      - name: Schema contract check (代码 DB 依赖 vs 生产 schema)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run qa:schema

      - name: Column-drift check (写/读列 vs 生产 schema)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRICT_READS: '1'
        run: npm run qa:insert-drift

      - name: Read-column-drift check (.select 读列 vs 生产 schema)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run qa:read-drift

  # ─────────────────────────────────────────────
  # Stage 1: Fast pre-flight checks
  # ─────────────────────────────────────────────
  pre-checks:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check migration versions
        run: |
          echo "Checking for duplicate migration versions..."
          MIGRATIONS_DIR="supabase/migrations"
          if [ -d "$MIGRATIONS_DIR" ]; then
            VERSIONS=$(ls "$MIGRATIONS_DIR"/*.sql 2>/dev/null | xargs -n1 basename | sed 's/_.*//' | sort)
            DUPLICATES=$(echo "$VERSIONS" | uniq -d)
            if [ -n "$DUPLICATES" ]; then
              echo "ERROR: Duplicate migration versions found:"
              echo "$DUPLICATES"
              exit 1
            fi
            echo "All migration versions are unique"
          else
            echo "No migrations directory found, skipping check"
          fi

      - name: Security — no server secret literals (public repository)
        run: node scripts/qa/secret-literal-guard.mjs

      - name: Security — npm audit (blocks on critical/high)
        run: |
          npm install --package-lock-only --ignore-scripts 2>/dev/null || true
          # Shipped (production) dependencies block on high/critical. Dev-only
          # tooling is reported but not blocking: the eslint-config-next →
          # fast-glob → micromatch → braces chain has no upstream fix (braces
          # 3.0.3 is latest) and never reaches the runtime bundle.
          npm audit --omit=dev --audit-level=high || {
            echo "::error::npm audit found high/critical vulnerabilities in production dependencies — fix before merging"
            exit 1
          }
          npm audit --audit-level=high || \
            echo "::warning::npm audit found high/critical vulnerabilities in dev-only dependencies (non-blocking)"

      - name: Security — no unsafe secret comparison
        run: |
          # Detect !== used to compare auth secrets (should use safeCompare/verifyCronSecret)
          # Pattern: variable containing "secret"/"Secret" compared with !==
          # Excludes: null checks, typeof checks, type guards, test files
          UNSAFE=$(grep -rn 'authHeader !== \|cronSecret\|CRON_SECRET.*!==' \
            app/api/ lib/api/ --include="*.ts" \
            | grep -v node_modules | grep -v __tests__ | grep -v '.test.' \
            | grep '!==' | grep -v 'safeCompare\|verifyCronSecret\|verifyAdminAuth' || true)
          if [ -n "$UNSAFE" ]; then
            echo "::error::Unsafe secret comparison found (use safeCompare/verifyCronSecret instead of !==):"
            echo "$UNSAFE"
            exit 1
          fi
          echo "No unsafe secret comparisons found ✅"

      - name: Style — no hardcoded thresholds
        run: |
          # Detect hardcoded threshold constants that should be in lib/constants/
          # Focus on patterns like: const MIN_TRADES = 5, const MAX_DRAWDOWN = 0.5
          HARDCODED=$(grep -rn 'const MIN_\|const MAX_\|const THRESHOLD\|const LIMIT_' \
            app/api/cron/ --include="*.ts" \
            | grep -v 'import\|from.*constants\|from.*thresholds' \
            | grep -v __tests__ || true)
          if [ -n "$HARDCODED" ]; then
            echo "::warning::Found hardcoded threshold constants in cron routes (should be in lib/constants/):"
            echo "$HARDCODED"
          else
            echo "No hardcoded thresholds in cron routes ✅"
          fi

      - name: Style — consistent error responses
        run: |
          # Count API routes using ad-hoc error patterns vs standard apiError/error()
          ADHOC=$(grep -rn "NextResponse.json.*error.*status:" app/api/ --include="*.ts" \
            | grep -v node_modules | grep -v __tests__ | grep -v 'apiError\|error(' | wc -l)
          STANDARD=$(grep -rn "apiError\|error(" app/api/ --include="*.ts" \
            | grep -v node_modules | grep -v __tests__ | wc -l)
          echo "Ad-hoc error responses: $ADHOC"
          echo "Standard error responses: $STANDARD"
          if [ "$ADHOC" -gt 100 ]; then
            echo "::warning::$ADHOC API routes still use ad-hoc error responses. Migrate to apiError() from lib/api/response.ts"
          fi

      - name: Install isolated PostgreSQL 17 server binaries
        env:
          # 固定 17.11：pgdg 的 17.12 给每个新建列写入 attoptions={pg_attver=…}，
          # 迁移 postflight 要求 attoptions IS NULL 且对其做布局指纹，会把自建表判成
          # "column contract drifted"（2026-11-13 起 Pre-flight 全红）。升级前须先评审
          # 这 6 个迁移的 attoptions 检查；17.11 取自 pgdg 归档源，不会被新版本挤掉。
          PG17_VERSION: 17.11-1.pgdg26.04+2
        run: |
          codename=$(lsb_release -cs)
          sudo sh -c "echo 'deb http://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo sh -c "echo 'deb https://apt-archive.postgresql.org/pub/repos/apt ${codename}-pgdg-archive main' > /etc/apt/sources.list.d/pgdg-archive.list"
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq --allow-downgrades "postgresql-17=${PG17_VERSION}" "postgresql-client-17=${PG17_VERSION}" ripgrep
          /usr/lib/postgresql/17/bin/initdb --version

      - name: Prove stage backfill, crossed epochs, and legacy replay
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:rank-staging-xid-pg17

      # 上线迁移有序通道的一次性 PG17 证明（回滚边界、串行化、超时、断连）。
      # 2026-08-04 起它因 readonly 列表在第一个场景前就中止却仍退出 0，从未被 CI 运行。
      - name: Prove launch-migration emitter on disposable PG17
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:launch-migration-runner-pg17

      - name: Prove immutable generation publication plans
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:rank-publication-plan-pg17

      - name: Prove public and token rank authority
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:public-rank-authority-pg17

      - name: Prove public ranked leaderboard source freshness
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:public-ranked-leaderboard-pg17

      - name: Prove the codec rebuild refuses file-name-order replay
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:codec-rebuild-slot-guard-pg17

      - name: Prove snapshot retention keeps publication evidence
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:snapshot-retention-pg17

      - name: Prove canonical score-input platform aliases
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:score-alias-pg17

      - name: Prove BingX public-rank authority quarantine
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:bingx-rank-quarantine-pg17

      - name: Prove Arena Score v4 PG17 golden vectors
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:score-v4-pg17

      - name: Prove Arena Score v5 trusted-zero semantics
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:score-v5-pg17

      - name: Prove Arena Score v5 manifest isolation
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:score-manifest-v2-pg17

      - name: Prove Arena Score v5 trust projection
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:score-projection-v2-pg17

      - name: Prove legacy position-history writer retirement
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:retire-legacy-position-history-pg17

      - name: Prove position-history records-page quarantine
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:records-page-quarantine-pg17

      - name: Prove all legacy position-history relations are frozen
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:legacy-position-history-freeze-pg17

      - name: Prove legacy daily-snapshot quarantine
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:legacy-daily-snapshot-quarantine-pg17

      - name: Prove V1 trader-alert browser mutation containment
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:v1-trader-alert-browser-mutations-pg17

      - name: Prove live serving resolver and capability boundaries
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:serving-boundary-pg17

      - name: Prove fail-closed copier containment and atomic publication
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:copier-publication-pg17

      - name: Prove exchange connection service-only ACL prerequisite
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:exchange-connection-acl-pg17

      - name: Prove sealed-publication data gap summary
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:sealed-gap-summary-pg17

      - name: Prove trader authorization service-only ACL
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:trader-authorization-acl-pg17

      - name: Prove legacy portfolio V1 retirement boundary
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:legacy-portfolio-retirement-pg17

      - name: Prove trader claim V2 immutable-deployment cutoff
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:trader-claim-v2-pg17

      - name: Prove B2C activation v2 measurement
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:b2c-activation-v2-pg17

      - name: Prove notification ranking-change reader fence
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:notification-ranking-change-reader-fence-pg17

      - name: Prove arena_bot legacy-publication isolation
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:arena-bot-legacy-publication-isolation-pg17

      - name: Prove trader-series publication isolation
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:trader-series-publication-isolation-pg17

      - name: Prove legacy raw-metric publication isolation
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:legacy-raw-metric-publication-isolation-pg17

      - name: Prove legacy platform-statistics RPC quarantine
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:legacy-platform-stats-rpc-pg17

      - name: Prove copier snapshot trust v2 publisher
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:copier-trust-publisher-v2-pg17

  # ─────────────────────────────────────────────
  # Stage 2: Lint + Type Check
  # ─────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: pre-checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # The repository ruleset already requires this job. Keep the offline
      # contract here as well as in its named job so PRs cannot merge while an
      # older four-check ruleset is still being updated.
      - run: npm run gen:types:contract
      - name: Migration history shape ratchet
        run: npm run qa:migration-history-shape
      - name: Launch migration runner fail-closed contract
        run: npm run qa:launch-migration-runner
      - name: Backup pipeline fail-closed contract
        run: node --test scripts/maintenance/backup-to-r2.test.mjs
      - name: Critical-tier backup encryption and coverage contract
        run: npm run qa:backup-critical
      - name: Restore pipeline fail-closed contract
        run: node --test scripts/maintenance/restore-from-r2.test.mjs
      - name: Auth recovery preflight fail-closed contract
        run: npm run qa:auth-recovery-preflight
      - name: Backup freshness fail-closed contract
        run: node --test scripts/openclaw/backup-freshness-check.test.mjs
      - name: Secret rotation retirement contract
        run: node --test scripts/security/rotate-secrets.test.mjs
      - run: npm run lint
      - name: Type-check application
        env:
          # The generated Database surface plus App Router graph now exceeds
          # V8's ~2 GiB default old-space limit on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx tsc --noEmit
      - name: Lint ingest worker
        run: npm run lint:ingest-worker
      - name: Type-check ingest worker and ownership control plane
        run: npm run type-check:ingest-worker
      - name: V1 ranking command-chain containment
        run: node --test worker/tests/v1-ranking-command-chain-containment.test.mjs scripts/qa/local-scoring-deploy.test.mjs scripts/qa/v1-legacy-proxy-import-containment.test.mjs
      - name: V1 native ingest execution containment
        run: node --test scripts/qa/v1-ingest-execution-containment.test.mjs
      - name: VPS process topology safety
        run: npm run qa:vps-topology
      - name: UI sweep unit contracts
        run: npm run qa:sweep-unit
      - name: Data-time honesty (computed_at is not data freshness)
        run: npm run qa:data-time

      # API 鉴权覆盖兜底(默认拒绝)：无根级 middleware，313+ route 靠自觉调 auth
      # wrapper——本检查强制每个 route 要么有 auth 原语要么在显式公开白名单，
      # 堵住"忘加鉴权=fail-open"（ENTERPRISE_GAP_ANALYSIS_2026-07 差距 #3）。
      # 纯本地 fs 扫描 <1s，无外部依赖。
      - name: API auth coverage check (route 级默认拒绝)
        run: npm run qa:api-auth

      # Supabase 类型旁路棘轮：`as SupabaseClient`(裸)/`as any`-on-.from/.rpc 剥掉
      # <Database> 泛型→列漂移能编译过(2026-07 漂移类的根源)。计数只许降不许升。
      # 纯本地 fs 扫描 <1s，无外部依赖。
      - name: Supabase typed-client bypass ratchet
        run: npm run qa:cast-ratchet

      # Deployable layers must not grow new reverse dependencies (lib->app,
      # lib->worker, UI->API route, ...). The checked-in baseline is the known
      # debt ledger and may only shrink; the base baseline is read at the event's
      # base SHA (taken from the event file, not interpolated).
      - name: Architecture boundary ratchet
        run: |
          set -euo pipefail
          ARCHITECTURE_BASE_REF="$(jq -r '.pull_request.base.sha // .before // empty' "$GITHUB_EVENT_PATH")"
          case "$ARCHITECTURE_BASE_REF" in 0000000000000000000000000000000000000000) ARCHITECTURE_BASE_REF= ;; esac
          export ARCHITECTURE_BASE_REF
          npm run qa:architecture

      - name: Core path gates
        run: node --test scripts/qa/core-coverage-floor.test.mjs scripts/qa/v1-surface.test.mjs scripts/qa/fix-requires-test.test.mjs scripts/qa/launch-inventory-gap.test.mjs

      # A pull request titled fix(...) must change a test, or say why not.
      - name: Fixes carry a regression test
        if: github.event_name == 'pull_request'
        run: node scripts/qa/fix-requires-test.mjs --event "$GITHUB_EVENT_PATH"

      - name: Migration lint — block dangerous DDL
        run: |
          set -euo pipefail
          node scripts/qa/migration-dangerous-ddl-check.mjs \
            --event "$GITHUB_EVENT_PATH" HEAD

      # Broader companion gate (all DROP / TRUNCATE / type, rename, schema,
      # partition, trigger changes / edits to committed migrations). The Node
      # gate owns diff enumeration; Git, I/O, and parser failures exit 2 and
      # policy findings exit 1. Do not wrap it in shell fallbacks.
      # The base SHA is read from the event file at runtime rather than
      # interpolated from github.event, matching the DDL lint above.
      - name: Migration SQL safety gate
        run: |
          set -euo pipefail
          MIGRATION_SAFETY_BASE_REF="$(jq -r '.pull_request.base.sha // .before // empty' "$GITHUB_EVENT_PATH")"
          export MIGRATION_SAFETY_BASE_REF
          npm run qa:migration-safety

  # ─────────────────────────────────────────────
  # Stage 3a: Unit Tests (parallel with build)
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      worker-ownership-redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      # Separate server: the ownership test requires an empty Redis, and jest
      # runs the two files in parallel workers.
      ingest-scheduler-redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts

      - name: Run tests with coverage
        env:
          WORKER_OWNERSHIP_REDIS_TEST_URL: redis://127.0.0.1:6379/15
          INGEST_SCHEDULER_REDIS_TEST_URL: redis://127.0.0.1:6380/15
        # Keep jsdom/webpack transforms inside the hosted-runner memory budget.
        # Unbounded CPU-derived workers caused deterministic 10s RTL timeouts
        # under coverage despite the same files passing alone.
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --ci --maxWorkers=2

      - name: Core path coverage floor
        run: node scripts/qa/core-coverage-floor.mjs coverage/coverage-summary.json

      # The season publication proof drives the TypeScript orchestrator, so it
      # runs here (node_modules installed) rather than in the SQL-only pre-checks.
      - name: Install isolated PostgreSQL 17 server binaries
        env:
          # 与 Pre-flight 同一固定版本：17.12 给新建列写 attoptions={pg_attver=…}，
          # 迁移 postflight 会判 "column contract drifted"（见 Pre-flight 同名步骤注释）。
          PG17_VERSION: 17.11-1.pgdg26.04+2
        run: |
          codename=$(lsb_release -cs)
          sudo sh -c "echo 'deb http://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo sh -c "echo 'deb https://apt-archive.postgresql.org/pub/repos/apt ${codename}-pgdg-archive main' > /etc/apt/sources.list.d/pgdg-archive.list"
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq --allow-downgrades "postgresql-17=${PG17_VERSION}" "postgresql-client-17=${PG17_VERSION}"
          /usr/lib/postgresql/17/bin/initdb --version

      - name: Prove one complete public ranking season publication
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:public-ranking-season-publication-pg17

      - name: Prove publication score inputs are bound to board evidence
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:score-input-evidence-pg17

      - name: Prove retention keeps metric-trust evidence
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:retention-trust-evidence-pg17

      - name: Prove public-source capture and metric contract registration
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:public-source-capture-contracts-pg17

      - name: Prove exhausted/total-mode public-source capture registration
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:public-source-exhaustion-capture-pg17

      - name: Prove exhausted-completeness evidence (end signal, pages, dups, version)
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: npm run qa:exhaustion-completeness-pg17

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # Stage 3b: Build (parallel with unit tests)
  # ─────────────────────────────────────────────
  build:
    name: Build
    # 固定 24.04：ubuntu-latest 自 2026-10 起是 26.04，Playwright 1.59 不支持在其上
    # 安装 Chromium（"Playwright does not support chromium on ubuntu26.04-x64"）。
    # 升级 Playwright 后可改回 ubuntu-latest。
    runs-on: ubuntu-24.04
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Build application
        env:
          # The production webpack graph exceeds V8's ~2 GiB default
          # old-space limit on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: production
          # build 时 next 收集页面数据会评估路由模块，@/lib/env 对 CRON_SECRET /
          # SUPABASE_* 做 fail-fast 校验（NODE_ENV=production 时硬抛）。Vercel build
          # 这些 env 全有，CI 也只需通过静态模块校验。PR 可修改 build 脚本，
          # 因此这里永远只给 dummy，绝不把生产 Supabase/cron secret 注入 PR。
          # 指向本地假 Supabase：NEXT_PUBLIC_* 在构建时写入产物，下面的核心路径
          # E2E 复用这次构建，避免每个 PR 多构建一次、多耗 Actions 分钟。
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-placeholder
          SUPABASE_URL: http://127.0.0.1:54399
          SUPABASE_SERVICE_ROLE_KEY: ci-build-service-placeholder
          # CriticalEnvSchema 要求 CRON_SECRET ≥32 字符，dummy 兜底须够长。
          CRON_SECRET: ci-build-placeholder-cron-secret-0000000000
        run: npm run build

      - name: Fake Supabase contract
        run: node --test scripts/e2e/fake-supabase.test.mjs

      - name: Install Chromium for core path E2E
        run: npx playwright install --with-deps chromium

      # 全部用假服务，不持有密钥、不访问真实服务；环境变量见 playwright.hermetic.config.ts。
      - name: Core path E2E (hermetic)
        env:
          CI: true
        run: npm run test:e2e:hermetic

      - name: Bundle size check
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh .next/static/ 2>/dev/null || true
          find .next/static -name '*.js' -exec du -sh {} \; | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          TOTAL=$(find .next/static -name '*.js' -exec cat {} + | wc -c)
          echo "Total JS size: $((TOTAL / 1024))KB"
          if [ "$TOTAL" -gt 5242880 ]; then
            echo "::warning::Bundle size exceeds 5MB threshold ($((TOTAL / 1024))KB)"
          fi

      - name: Clean build artifacts for upload
        run: |
          find .next -name '*:*' -delete 2>/dev/null || true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: nextjs-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  # ─────────────────────────────────────────────
  # Stage 4: Public production E2E canary (push main only)
  # ─────────────────────────────────────────────
  e2e:
    name: Production E2E Canary (read-only)
    runs-on: ubuntu-latest
    # V1 NO-GO：该作业直接访问生产站，属于生产读取；在 owner 另行批准只读取证前
    # 保持关闭（与 types-live-drift / data-consistency 同一处理）。恢复时改回
    # github.event_name == 'push' && github.ref == 'refs/heads/main'。
    if: ${{ false }}
    # 关键路径只跑 desktop smoke-critical-path（当前 5 用例），~3-5min 就
    # 完成。此前跑全量 46 spec × 4 端设备 × workers=1 × retries=2 → 永远跑不完、必到
    # 30min job 超时被取消：既不给真实 green/red 信号，又让 CI「完成」晚 30min → 每次
    # 安静 main 上的部署被 deploy-gate 白等半小时。全量矩阵（含 mobile/tablet）由
    # e2e-nightly.yml（每日 03:00 UTC）兜底。这里直接打公开生产站，不读取 secret、
    # 不下载 placeholder build artifact、不启动本地 server。E2E 仍非部署门禁
    # （门禁看 types-contract/types-live-drift 与四个核心作业），只提供 live
    # canary 信号。
    timeout-minutes: 12
    # E2E 只保留"最新 commit"一份在跑（成本控制）；被取消不影响部署门禁
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts

      # Desktop smoke only → chromium is enough. Nightly installs webkit for the
      # full mobile/tablet matrix.
      - run: npx playwright install --with-deps chromium

      # Fast desktop smoke of the critical path. Full 4-device matrix runs nightly
      # (e2e-nightly.yml) so "works on desktop, broken on mobile" is still caught,
      # just off the deploy critical path.
      - run: npm run test:e2e:smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://www.arenafi.org

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/**/*.png
          retention-days: 7

  # ─────────────────────────────────────────────
  # Stage 5: Data Consistency (post-deploy verification)
  # Only runs on push to main (not PRs)
  # ─────────────────────────────────────────────
  data-consistency:
    name: Data Consistency Check
    runs-on: ubuntu-latest
    needs: unit-tests
    # SECURITY SUSPENDED (V1 NO-GO): restore only with reviewer-gated,
    # environment-only production read/hook/alert credentials.
    if: ${{ false }}
    env:
      NEXT_PUBLIC_SITE_URL: https://www.arenafi.org
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts

      - name: E2E data consistency verification
        run: npx tsx scripts/e2e-data-verify.ts --verbose
        continue-on-error: true
        id: e2e_check

      - name: Trigger pipeline evaluator (18 checks)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.arenafi.org/api/cron/pipeline-evaluate")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Evaluator response: $HTTP_CODE"
          echo "$BODY" | jq '.score, .issues, .critical' 2>/dev/null || echo "$BODY"
          SCORE=$(echo "$BODY" | jq -r '.score // 0' 2>/dev/null || echo "0")
          echo "score=$SCORE" >> $GITHUB_OUTPUT
        id: evaluator
        continue-on-error: true

      # schema-contract 已移到 lint-typecheck job(不依赖 build/unit-tests,独立
      # 运行,见上)。这里只留 advisory 的 ledger 核对。

      # 迁移落地核对(P1):baseline 后仓库迁移必须都在生产 ledger。
      # 首次 continue-on-error,确认一次绿色运行后提升为阻断门。
      - name: Migration ledger check (仓库迁移 vs 生产 ledger)
        run: npm run qa:migrations
        continue-on-error: true
        id: migration_ledger

      - name: Alert on data inconsistency
        if: steps.e2e_check.outcome == 'failure' || (steps.evaluator.outputs.score != '' && steps.evaluator.outputs.score < 60)
        run: |
          TELEGRAM_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="🚨 *Arena Data Regression*%0A"
            MSG+="Commit: $(git log -1 --pretty=%h)%0A"
            MSG+="E2E: ${{ steps.e2e_check.outcome }}%0A"
            MSG+="Evaluator: ${{ steps.evaluator.outputs.score }}/100%0A"
            MSG+="$(git log -1 --pretty=%s)"
            curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown" || true
          fi
