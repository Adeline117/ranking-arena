name: Vercel Release Control

# Vercel's Git integration and Deploy Gate must never both write the production
# domains. Keep Git deployments staged; Deploy Gate is the sole promoter after
# CI, exact-SHA smoke, and rollback-anchor capture.
# SECURITY SUSPENDED (V1 NO-GO): restore only after VERCEL_* credentials are
# environment-only in a production-control environment with a required reviewer
# and protected-main policy. Manual arbitrary-ref dispatch must not return.
on:
  workflow_call: {}

concurrency:
  group: vercel-release-control-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enforce-single-production-writer:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Disable Git auto-assignment and verify project state
        run: node scripts/ci/enforce-vercel-release-control.mjs
