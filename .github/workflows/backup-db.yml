# DB 备份冗余 → R2（企业级差距 #2 单点消除 · Phase 2）
#
# 消除 Mac Mini 备份单点：GH Actions 每日 pg_dump→R2，与 Mac Mini crontab(03:30)
# 错峰。关键改进(2026-07 发现)：**用显式 schema 模式抓 arena+public 主数据层**。
# 该产物覆盖应用数据，但不含托管 auth/storage，也尚未通过 managed scratch
# 恢复演练，因此不能标记成完整灾备恢复点。
#
# 安全：连接用**只读角色 arena_backup_ro**(pg_read_all_data + BYPASSRLS)而非主
# service DATABASE_URL——GH secret 泄露最坏只能读(可 exfiltrate)、不能写(不可
# 破坏/勒索)。已实测 ro 角色读 arena.trader_stats=415544 行与主 URL 一致(完整)。
#
# SECURITY SUSPENDED (V1 NO-GO): main currently has no enforceable protection,
# so scheduled default-branch code must not receive database, R2, or alerting
# credentials. Every job is fixed false below. Restore only after those values
# are environment-only, the environment has a required reviewer, and main is
# protected against direct writes; then obtain a fresh qualified backup first.

name: DB Backup to R2

permissions:
  contents: read

on:
  schedule:
    - cron: '30 15 * * *' # 每日 15:30 UTC（错峰 Mac Mini 本地 03:30）

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      - name: Install PostgreSQL 17 client（匹配 Supabase 服务器）
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/pgdg.gpg "$RUNNER_TEMP/pgdg.asc"
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Backup arena+public application schemas → R2（只读角色）
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SCHEMAS: arena,public
          PG_DUMP_PATH: /usr/lib/postgresql/17/bin/pg_dump
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: node scripts/maintenance/backup-to-r2.mjs

  notify:
    needs: backup
    # Resume condition: ${{ always() && needs.backup.result != 'success' }}
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alert on failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo '::error::TELEGRAM_BOT_TOKEN is missing; backup failure alert cannot be delivered'
            exit 1
          fi
          if [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo '::error::TELEGRAM_ALERT_CHAT_ID is missing; backup failure alert cannot be delivered'
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=$TELEGRAM_ALERT_CHAT_ID" \
            -d "text=🚨 [GH Actions] DB 备份失败（arena+public → R2）—— 人工查 workflow 日志")"
          jq -e '.ok == true' <<<"$response" >/dev/null
