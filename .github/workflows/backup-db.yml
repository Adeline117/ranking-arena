# DB 备份冗余 → R2（企业级差距 #2 单点消除 · Phase 2）
#
# 消除 Mac Mini 备份单点：GH Actions 每日 pg_dump→R2，与 Mac Mini crontab(03:30)
# 错峰。关键改进(2026-07 发现)：**用显式 schema 模式抓 arena+public 主数据层**。
# 该产物覆盖应用数据，但不含托管 auth/storage，也尚未通过 managed scratch
# 恢复演练，因此不能标记成完整灾备恢复点。
#
# 安全：连接用**只读角色 arena_backup_ro**(pg_read_all_data + BYPASSRLS)而非主
# service DATABASE_URL——GH secret 泄露最坏只能读(可 exfiltrate)、不能写(不可
# 破坏/勒索)。已实测 ro 角色读 arena.trader_stats=415544 行与主 URL 一致(完整)。

name: DB Backup to R2

on:
  schedule:
    - cron: '30 15 * * *' # 每日 15:30 UTC（错峰 Mac Mini 本地 03:30）
  workflow_dispatch: {}

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate backup configuration
        id: preflight
        shell: bash
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=()
          [ -n "${BACKUP_DATABASE_URL:-}" ] || missing+=(BACKUP_DATABASE_URL)
          [ -n "${R2_ACCOUNT_ID:-}" ] || missing+=(R2_ACCOUNT_ID)
          [ -n "${R2_ACCESS_KEY_ID:-}" ] || missing+=(R2_ACCESS_KEY_ID)
          [ -n "${R2_SECRET_ACCESS_KEY:-}" ] || missing+=(R2_SECRET_ACCESS_KEY)
          [ -n "${R2_BUCKET:-}" ] || missing+=(R2_BUCKET)

          if [ "${#missing[@]}" -gt 0 ]; then
            MISSING_NAMES=$(printf '%s, ' "${missing[@]}")
            MISSING_NAMES=${MISSING_NAMES%, }
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
            printf '::error title=DB backup configuration invalid::Missing required secret names: %s\n' \
              "$MISSING_NAMES"
            {
              echo '### DB backup configuration invalid'
              echo
              printf 'Missing required secret names: `%s`\n' "$MISSING_NAMES"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          printf 'configured=true\n' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      - name: Install PostgreSQL 17 client（匹配 Supabase 服务器）
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Backup arena+public application schemas → R2（只读角色）
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SCHEMAS: arena,public
          PG_DUMP_PATH: /usr/lib/postgresql/17/bin/pg_dump
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/maintenance/backup-to-r2.mjs

      - name: Alert on failure
        if: failure()
        shell: bash
        env:
          BACKUP_CONFIGURED: ${{ steps.preflight.outputs.configured }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          missing=()
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || missing+=(TELEGRAM_BOT_TOKEN)
          [ -n "${TELEGRAM_CHAT_ID:-}" ] || missing+=(TELEGRAM_ALERT_CHAT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            MISSING_NAMES=$(printf '%s, ' "${missing[@]}")
            MISSING_NAMES=${MISSING_NAMES%, }
            printf '::error title=DB backup alert delivery failed::Missing required secret names: %s\n' \
              "$MISSING_NAMES"
            printf '### DB backup alert delivery failed — missing required secret names: `%s`\n' \
              "$MISSING_NAMES" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$BACKUP_CONFIGURED" = 'false' ]; then
            MESSAGE='🚨 [GH Actions] DB 备份配置预检失败——人工检查 workflow 缺失 secret 名称'
          else
            MESSAGE='🚨 [GH Actions] DB 备份执行失败（arena+public → R2）——人工检查 workflow 日志'
          fi

          CURL_EXIT=0
          HTTP=$(curl --silent --show-error \
            --connect-timeout 5 --max-time 10 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}") || CURL_EXIT=$?
          if [ "$CURL_EXIT" -ne 0 ] || [[ "${HTTP:-000}" != 2* ]]; then
            echo "::error title=DB backup alert delivery failed::curl=$CURL_EXIT HTTP=${HTTP:-000}"
            echo "### DB backup alert delivery failed — curl=$CURL_EXIT HTTP=${HTTP:-000}" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "DB backup alert delivered HTTP $HTTP"
