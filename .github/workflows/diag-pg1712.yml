name: diag-pg1712 (temporary, do not merge)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned PG 17.11 from pgdg archive
        env:
          PG17_VERSION: 17.11-1.pgdg26.04+2
        run: |
          codename=$(lsb_release -cs)
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo sh -c "echo 'deb http://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo sh -c "echo 'deb https://apt-archive.postgresql.org/pub/repos/apt ${codename}-pgdg-archive main' > /etc/apt/sources.list.d/pgdg-archive.list"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --allow-downgrades "postgresql-17=${PG17_VERSION}" "postgresql-client-17=${PG17_VERSION}" ripgrep
          /usr/lib/postgresql/17/bin/initdb --version
      - name: Re-run the failing proof on 17.11
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: bash supabase/migrations/__tests__/leaderboard-rank-generation-staging-only-writer.pg17.sh
