name: Smart Contract Build

on:
  pull_request:
    paths:
      - '.github/workflows/contracts.yml'
      - '.gitmodules'
      - 'contracts/**'
      - 'script/**'
      - 'lib/forge-std'
      - 'foundry.toml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/contracts.yml'
      - '.gitmodules'
      - 'contracts/**'
      - 'script/**'
      - 'lib/forge-std'
      - 'foundry.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1

      - name: Compile contracts
        run: npm run contracts:build
