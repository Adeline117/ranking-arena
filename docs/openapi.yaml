openapi: '3.0.3'
info:
  title: Arena API
  description: >
    Cryptocurrency trader ranking and community platform. Runtime coverage and
    freshness are reported by the health/publication authority rather than a
    hard-coded trader or source count. Owner-only legacy Portfolio inventory,
    portable settings export, and deletion are operational account capabilities,
    not exchange-integration primitives. Legacy Portfolio connect, sync,
    positions, and snapshots return 410 in V1; the separate
    `/portfolio/{address}` route is a deprecated anonymous public-egress
    source hold that returns fixed `410 PUBLIC_EGRESS_NOT_PUBLISHED` rather
    than a live EVM-address lookup.
  version: '2.0.0'
  contact:
    name: Arena
    url: https://www.arenafi.org

servers:
  - url: https://www.arenafi.org/api
    description: Production
  - url: http://localhost:3000/api
    description: Local Development

tags:
  - name: Health
    description: Health check endpoints
  - name: Rankings
    description: Trader leaderboard
  - name: Traders
    description: Individual trader data
  - name: Identity & Accounts
    description: Authenticated identity claims and private exchange-account connections
  - name: Search
    description: Unified search
  - name: Follow
    description: Follow/unfollow traders
  - name: Posts
    description: Community posts
  - name: Groups
    description: Trading groups

paths:
  /health:
    get:
      tags: [Health]
      summary: Health Check
      description: >
        Returns public application health status for API transport, database,
        Redis, and ranking freshness. This endpoint does not probe VPS
        scraper/proxy connectivity; separate external monitoring is outside
        this contract.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy]
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: '0.1.0'
                  uptime:
                    type: integer
                    description: Uptime in seconds
                  responseTimeMs:
                    type: integer
                  checks:
                    type: object
                    properties:
                      api:
                        $ref: '#/components/schemas/HealthCheck'
                      database:
                        $ref: '#/components/schemas/HealthCheck'
                      redis:
                        $ref: '#/components/schemas/HealthCheck'
                      freshness:
                        $ref: '#/components/schemas/HealthCheck'
        '202':
          description: Degraded (Redis or ranking freshness unavailable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [degraded]
                    example: degraded
        '503':
          description: Unhealthy (database unreachable)
    head:
      tags: [Health]
      summary: Health Ping
      description: Lightweight health ping (no body).
      responses:
        '200':
          description: OK

  /rankings:
    get:
      tags: [Rankings]
      summary: Get Trader Rankings
      description: >
        Returns ranked traders for a given time window.
        Reads from the publication-fenced leaderboard authority and serves a
        canonical Redis snapshot with a last-known-good fallback. Pagination
        uses offset and limit; cursor pagination is not currently supported.
      parameters:
        - name: window
          in: query
          required: true
          description: Time window for ranking
          schema:
            type: string
            enum: [7d, 30d, 90d, composite]
        - name: category
          in: query
          description: Filter by trading category
          schema:
            type: string
            enum: [futures, spot, onchain]
        - name: platform
          in: query
          description: Filter by specific platform (overrides category)
          schema:
            type: string
            example: binance_futures
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [arena_score, roi, pnl, drawdown, copiers]
            default: arena_score
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          description: Zero-based result offset
          schema:
            type: integer
            default: 0
        - name: min_pnl
          in: query
          schema:
            type: number
        - name: min_trades
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Ranked traders
          content:
            application/json:
              schema:
                type: object
                properties:
                  traders:
                    type: array
                    items:
                      $ref: '#/components/schemas/RankedTrader'
                  window:
                    type: string
                    example: '90D'
                  totalcount:
                    type: integer
                  total_count:
                    type: integer
                  as_of:
                    type: string
                    format: date-time
                  is_stale:
                    type: boolean
                  availableSources:
                    type: array
                    items:
                      type: string
                  next_cursor:
                    type: string
                    nullable: true
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /traders:
    get:
      tags: [Traders]
      summary: Get Traders (Leaderboard)
      description: >
        Reads from pre-computed leaderboard_ranks table.
        Supports cursor-based and page-based pagination.
      parameters:
        - name: timeRange
          in: query
          schema:
            type: string
            enum: [7D, 30D, 90D]
            default: '90D'
        - name: exchange
          in: query
          description: Filter by exchange platform
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [arena_score, roi, pnl, win_rate, max_drawdown, sortino_ratio]
            default: arena_score
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: cursor
          in: query
          description: >-
            Persisted rank value to start after. Supported only with
            sortBy=arena_score and order=desc; use page pagination for every
            other ordering.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: page
          in: query
          description: Legacy page number (0-indexed)
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  traders:
                    type: array
                    items:
                      $ref: '#/components/schemas/TraderListItem'
                  timeRange:
                    type: string
                  totalCount:
                    type: integer
                  rankingMode:
                    type: string
                  lastUpdated:
                    type: string
                    format: date-time
                  isStale:
                    type: boolean
                  nextCursor:
                    type: integer
                    nullable: true
                  hasMore:
                    type: boolean
                  availableSources:
                    type: array
                    items:
                      type: string

  /traders/{handle}:
    get:
      tags: [Traders]
      summary: Get Trader Detail
      description: >
        Resolves the canonical trader handle and returns the current public
        profile, performance, portfolio, position history, equity curves, asset
        breakdown, and similar traders. Optional public extras can be requested
        with include. Responses are served from current database projections;
        latency is measured through the published service SLO rather than
        guaranteed per request.
      parameters:
        - name: handle
          in: path
          required: true
          description: Canonical Arena handle, source trader key, or supported lookup alias.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Optional source discriminator when a handle is ambiguous.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Comma-separated optional public projections.
          schema:
            type: string
            example: claim,rank_history
      responses:
        '200':
          description: Trader detail
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    description: Current public trader page projection and requested extras.
                    additionalProperties: true
                    properties:
                      profile:
                        type: object
                        additionalProperties: true
                      performance:
                        type: object
                        additionalProperties: true
                      claim_status:
                        type: object
                        nullable: true
                        additionalProperties: true
                      rank_history:
                        type: object
                        nullable: true
                        additionalProperties: true
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Invalid handle or query parameter
        '404':
          description: Trader not found

  /traders/claim:
    get:
      tags: [Identity & Accounts]
      summary: Get the authenticated user's claim state
      description: >
        Returns the claim for the requested source/trader identity together
        with the authenticated user's verified and linked-trader projections.
        Both query parameters are required. Every outcome is private and
        non-cacheable at browser and intermediary layers.
      security:
        - bearerAuth: []
      parameters:
        - name: trader_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
        - name: source
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Claim and linked-identity state
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [claim, verified_trader, is_verified, linked_traders, linked_count]
                    properties:
                      claim:
                        type: object
                        nullable: true
                        additionalProperties: true
                      verified_trader:
                        type: object
                        nullable: true
                        additionalProperties: true
                      is_verified:
                        type: boolean
                      linked_traders:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      linked_count:
                        type: integer
                        minimum: 0
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Missing or invalid trader_id/source
        '401':
          description: Missing or invalid bearer token, inactive account, or missing application profile
        '429':
          description: Read rate limit exceeded
        '500':
          description: Claim state could not be read
    post:
      tags: [Identity & Accounts]
      summary: Submit a V1 wallet-owned trader claim
      description: >
        Accepts only Hyperliquid or GMX, where the public leaderboard identity
        is the EVM address verified by a server-issued one-time challenge. A
        valid signature creates a reviewing claim; it does not activate a
        verified profile or badge. Replay authority is Redis-backed and has no
        in-memory fallback. Redis unavailability returns 503 fail closed. The
        route emits private, no-store headers for every success and error
        response.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trader_id, source, verification_method, verification_data]
              properties:
                trader_id:
                  type: string
                  maxLength: 512
                  description: EVM address that identifies the public trader.
                source:
                  type: string
                  enum: [hyperliquid, gmx]
                verification_method:
                  type: string
                  enum: [signature]
                verification_data:
                  type: object
                  required: [wallet_address, signature, challenge_id]
                  properties:
                    wallet_address:
                      type: string
                      maxLength: 512
                    signature:
                      type: string
                      maxLength: 2048
                    challenge_id:
                      type: string
                      pattern: '^[a-f0-9]{64}$'
      responses:
        '200':
          description: Signature verified and claim queued for manual owner review
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [claim, message, auto_approved]
                    properties:
                      claim:
                        type: object
                        additionalProperties: true
                      message:
                        type: string
                      auto_approved:
                        type: boolean
                        enum: [false]
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Unsupported source, invalid proof, replayed challenge, or already-claimed trader
        '401':
          description: Missing or invalid bearer token, inactive account, or missing application profile
        '429':
          description: Sensitive-operation rate limit exceeded
        '500':
          description: Claim submission failed without activating a public identity
        '503':
          description: Wallet challenge/replay authority unavailable; request fails closed
          headers:
            Retry-After:
              schema:
                type: integer
                example: 30
            Cache-Control:
              schema:
                type: string
                example: private, no-store

  /traders/claim/wallet-challenge:
    post:
      tags: [Identity & Accounts]
      summary: Issue a one-time V1 wallet-claim challenge
      description: >
        Issues the only message accepted by POST /api/traders/claim. The
        five-minute challenge binds the authenticated user, canonical source,
        canonical trader address, Arena domain, nonce, and expiry. Redis is the
        sole challenge authority; if it cannot coordinate nonce/replay state,
        the route returns 503 and issues no fallback challenge.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trader_id, source]
              properties:
                trader_id:
                  type: string
                  maxLength: 512
                source:
                  type: string
                  enum: [hyperliquid, gmx]
      responses:
        '200':
          description: Server-authoritative challenge
          headers:
            Cache-Control:
              description: Challenge responses must not be stored.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [challenge_id, message, expires_at]
                    properties:
                      challenge_id:
                        type: string
                        pattern: '^[a-f0-9]{64}$'
                      message:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Unsupported source, invalid wallet identity, or trader already claimed/reviewing
        '401':
          description: Missing or invalid bearer token, inactive account, or missing application profile
        '429':
          description: Sensitive-operation rate limit exceeded
        '500':
          description: Challenge precondition check failed
        '503':
          description: Redis challenge authority unavailable; no challenge is issued
          headers:
            Retry-After:
              schema:
                type: integer
                example: 30
            Cache-Control:
              schema:
                type: string
                example: private, no-store

  /trader/authorize:
    post:
      tags: [Identity & Accounts]
      summary: Save a private V1 read-only exchange connection
      description: >
        The sole live public API-key binding route in V1. It accepts only exact
        base platforms Binance, Bybit, and Bitget. The server verifies the key
        with the exchange and stores both private connection projections through
        one service-only atomic RPC; validation or storage failure has no direct
        table fallback. Saving an account connection does not create a trader
        claim or badge and does not queue or publish first-party leaderboard
        data. Every success, validation, authentication, rate-limit, and internal
        error response is explicitly private and non-cacheable at the browser,
        CDN, and Vercel CDN layers. The route rejects unknown fields, malformed
        JSON, wrong optional-field types, values outside the documented length
        limits, and unsupported sync frequencies before calling the binder.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, apiKey, apiSecret]
              properties:
                platform:
                  type: string
                  maxLength: 64
                  enum: [binance, bybit, bitget]
                apiKey:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
                  format: password
                apiSecret:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  writeOnly: true
                  format: password
                passphrase:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
                  format: password
                  description: Required for Bitget.
                label:
                  type: string
                  minLength: 1
                  maxLength: 120
                syncFrequency:
                  type: string
                  enum: [realtime, 5min, 15min, 1hour]
                  default: realtime
      responses:
        '200':
          description: Read-only private connection saved; no public profile publication queued
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - authorizationId
                  - traderId
                  - permissions
                  - initialSyncQueued
                  - publicProfilePublishing
                  - message
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  authorizationId:
                    type: string
                    format: uuid
                  traderId:
                    type: string
                  nickname:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  initialSyncQueued:
                    type: boolean
                    enum: [false]
                  publicProfilePublishing:
                    type: boolean
                    enum: [false]
                  message:
                    type: string
        '400':
          description: Malformed JSON, unknown or invalid field, unsupported platform, missing Bitget passphrase, or exchange validation failure
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '401':
          description: A strict Bearer token for an active Arena account is required
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '429':
          description: Write rate limit exceeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '500':
          description: Atomic credential storage unavailable or another internal failure; no direct-table fallback is used
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
    get:
      tags: [Identity & Accounts]
      summary: List active private account authorizations
      description: >
        Returns only the authenticated owner's safe status projection. Encrypted
        credentials and OAuth tokens never leave the service boundary. The
        route has an explicit read rate limit. Every outcome is explicitly
        private and non-cacheable at the browser and intermediary layers.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active authorization status projections
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [authorizations]
                properties:
                  authorizations:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, platform, status, created_at]
                      properties:
                        id:
                          type: string
                          format: uuid
                        platform:
                          type: string
                        trader_id:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum: [active]
                        permissions:
                          type: array
                          nullable: true
                          items:
                            type: string
                        label:
                          type: string
                          nullable: true
                        sync_frequency:
                          type: string
                          nullable: true
                        read_only_verified_at:
                          type: string
                          format: date-time
                          nullable: true
                        last_sync_at:
                          type: string
                          format: date-time
                          nullable: true
                        last_sync_status:
                          type: string
                          nullable: true
                        verification_error:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
        '401':
          description: A strict Bearer token for an active Arena account is required
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '429':
          description: Read rate limit exceeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '500':
          description: Authorization status projection could not be read
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
    delete:
      tags: [Identity & Accounts]
      summary: Atomically revoke a private account authorization
      description: >
        Revokes the authenticated owner's authorization by UUID through the
        service-only account-lifecycle RPC. RPC/storage failure returns 500;
        there is no direct-table or partial-projection fallback. Every outcome
        is explicitly private and non-cacheable at browser and intermediary
        layers.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorization revoked
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
        '400':
          description: Missing or invalid authorization UUID
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '401':
          description: A strict Bearer token for an active Arena account is required
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '404':
          description: No active authorization owned by this user matches the UUID
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '429':
          description: Write rate limit exceeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '500':
          description: Atomic revocation failed; no partial fallback is used
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'

  /exchange/sync:
    post:
      tags: [Identity & Accounts]
      summary: Fetch a private exchange-account summary
      description: >
        Authenticated owner-only operation over an active private connection.
        Credentials are decrypted server-side and are never returned. The route
        computes a private trade summary and updates connection sync status; it
        does not write or publish public leaderboard data. The exact V1 sync
        scope is Binance, Bybit, and Bitget; no other exchange can return a
        synthetic success. Persisting the successful private connection status
        is a response precondition. Every outcome is explicitly private and
        non-cacheable at browser and intermediary layers.
      security:
        - bearerAuth: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exchange]
              properties:
                exchange:
                  type: string
                  enum: [binance, bybit, bitget]
      responses:
        '200':
          description: Private sync attempt completed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [message, tradesCount, stats]
                    properties:
                      message:
                        type: string
                        enum: [Sync successful]
                      tradesCount:
                        type: integer
                        minimum: 0
                      stats:
                        type: object
                        properties:
                          totalTrades:
                            type: integer
                          avgProfit:
                            type: number
                          avgLoss:
                            type: number
                          profitableTradesPct:
                            type: number
                          tradesPerWeek:
                            type: number
                          activeSince:
                            type: string
                            format: date-time
                            nullable: true
        '400':
          description: Invalid JSON or unsupported exchange
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '401':
          description: Missing or invalid bearer token, inactive account, or missing application profile
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '403':
          description: Missing/mismatched csrf-token cookie and x-csrf-token header, or basic bot check failed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '404':
          description: No exact active connection owned by this user and exchange
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '429':
          description: Sensitive-operation rate limit exceeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '500':
          description: Credential decryption, exchange fetch, success-status persistence, or another internal operation failed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'

  /exchange/connect:
    post:
      tags: [Identity & Accounts]
      summary: Retired exchange connection endpoint
      description: >
        Fixed V1 retirement response. The route performs no authentication,
        credential validation, persistence, or queueing. Use POST
        /api/trader/authorize.
      deprecated: true
      security: []
      responses:
        '410':
          description: Gone; use /api/trader/authorize
          headers:
            Cache-Control:
              description: Prevents storage of the retirement response.
              schema:
                type: string
                example: private, no-store, max-age=0
            Link:
              description: Successor endpoint relation.
              schema:
                type: string
                example: '</api/trader/authorize>; rel="successor-version"'
          content:
            application/json:
              schema:
                type: object
                required: [success, error, successor]
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    type: string
                  successor:
                    type: string
                    enum: [/api/trader/authorize]

  /trader/bind-api-key:
    post:
      tags: [Identity & Accounts]
      summary: Retired API-key binding endpoint
      description: >
        This endpoint is retired and performs no authentication, credential
        validation, persistence, or queueing. Use POST /api/trader/authorize.
      deprecated: true
      security: []
      responses:
        '410':
          description: Gone; use /api/trader/authorize
          headers:
            Cache-Control:
              description: Prevents storage of the retirement response.
              schema:
                type: string
                example: private, no-store, max-age=0
            Link:
              description: Successor endpoint relation.
              schema:
                type: string
                example: '</api/trader/authorize>; rel="successor-version"'
          content:
            application/json:
              schema:
                type: object
                required: [success, error, successor]
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    type: string
                    example: This API key binding endpoint is retired. Use /api/trader/authorize.
                  successor:
                    type: string
                    enum: [/api/trader/authorize]

  /trader/sync:
    post:
      tags: [Identity & Accounts]
      summary: Retired public first-party sync endpoint
      description: >
        Arena V1 account connections are private and do not prove public
        leaderboard-profile ownership. This endpoint performs no authentication,
        credential access, persistence, or queueing.
      deprecated: true
      security: []
      responses:
        '410':
          description: Public first-party trader sync is unavailable in V1
          headers:
            Cache-Control:
              description: Prevents storage of the retirement response.
              schema:
                type: string
                example: private, no-store, max-age=0
