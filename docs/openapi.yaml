                  success:
                    type: boolean
                    enum: [false]
                  error:
                    type: string

  /exchange/oauth/authorize:
    get:
      tags: [Identity & Accounts]
      summary: Retired exchange OAuth authorization endpoint
      description: >
        Fixed unauthenticated V1 retirement response. It performs no OAuth
        redirect, token exchange, credential persistence, or queueing. OAuth
        may return only after it shares the encrypted, read-only, atomic
        bind/revoke lifecycle used by account connections.
      deprecated: true
      security: []
      responses:
        '410':
          $ref: '#/components/responses/RetiredExchangeOAuth'

  /exchange/oauth/callback:
    post:
      tags: [Identity & Accounts]
      summary: Retired exchange OAuth callback endpoint
      description: >
        Fixed unauthenticated V1 retirement response. It does not parse an
        OAuth callback, exchange a code, or persist credentials.
      deprecated: true
      security: []
      responses:
        '410':
          $ref: '#/components/responses/RetiredExchangeOAuth'

  /exchange/oauth/refresh:
    post:
      tags: [Identity & Accounts]
      summary: Retired exchange OAuth token refresh endpoint
      description: >
        Fixed unauthenticated V1 retirement response. It performs no token
        lookup, decryption, provider request, or persistence.
      deprecated: true
      security: []
      responses:
        '410':
          $ref: '#/components/responses/RetiredExchangeOAuth'

  /portfolio:
    get:
      tags: [Identity & Accounts]
      summary: List owner cleanup metadata for legacy CEX portfolios
      description: >
        Returns only id, exchange, label, and created_at for legacy Portfolio
        rows owned by the authenticated user. It never returns credentials,
        positions, or snapshots. This owner-cleanup inventory is unrelated to
        the deprecated public-egress hold at `/portfolio/{address}`. Every
        outcome is private and non-cacheable.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owner-scoped legacy Portfolio metadata
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegacyPortfolioMetadata'
                  meta:
                    type: object
                    required: [timestamp]
                    properties:
                      timestamp:
                        type: string
                        format: date-time
        '401':
          description: Authentication required
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '429':
          description: Read rate limit exceeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '500':
          description: Metadata inventory could not be read
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
    post:
      tags: [Identity & Accounts]
      summary: Retired legacy Portfolio credential creation
      description: >
        Fixed V1 retirement response before authentication, body parsing,
        credential validation, persistence, or queueing.
      deprecated: true
      security: []
      responses:
        '410':
          $ref: '#/components/responses/RetiredLegacyPortfolio'
    delete:
      tags: [Identity & Accounts]
      summary: Delete an owner-scoped legacy Portfolio copy
      description: >
        Deletes one authenticated owner's retained Arena copy through the
        service-only owner-filtered RPC. Child positions and snapshots cascade
        atomically. This does not revoke the API key at the exchange; the owner
        must revoke or rotate it there separately. Every outcome is private and
        non-cacheable.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Arena copy deleted with its child rows
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: boolean
                        enum: [true]
                  meta:
                    type: object
                    required: [timestamp]
                    properties:
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Missing or invalid portfolio UUID
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '401':
          description: Authentication required
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '404':
          description: No legacy Portfolio owned by this user matches the UUID
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '429':
          description: Write rate limit exceeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '500':
          description: Atomic owner-scoped deletion failed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'

  /portfolio/sync:
    post:
      tags: [Identity & Accounts]
      summary: Retired legacy Portfolio credential sync
      description: >
        Fixed V1 retirement response before body parsing, credential access,
        outbound exchange requests, persistence, or queueing.
      deprecated: true
      security: []
      responses:
        '410':
          $ref: '#/components/responses/RetiredLegacyPortfolio'

  /portfolio/positions:
    get:
      tags: [Identity & Accounts]
      summary: Retired legacy Portfolio position projection
      description: Fixed V1 retirement response without reading retained credentials or positions.
      deprecated: true
      security: []
      responses:
        '410':
          $ref: '#/components/responses/RetiredLegacyPortfolio'

  /portfolio/snapshots:
    get:
      tags: [Identity & Accounts]
      summary: Retired legacy Portfolio snapshot projection
      description: Fixed V1 retirement response without reading retained credentials or snapshots.
      deprecated: true
      security: []
      responses:
        '410':
          $ref: '#/components/responses/RetiredLegacyPortfolio'

  /portfolio/{address}:
    get:
      tags: [Traders]
      summary: Retired public EVM address portfolio acquisition
      description: >
        V1 source holds this anonymous public-egress route at fixed
        `410 PUBLIC_EGRESS_NOT_PUBLISHED`. It does not read the dynamic address,
        cache, EVM adapter, logger, RPC, or provider, and is separate from the
        retained legacy Portfolio credential plane. This source-only contract
        does not stop, inspect, or prove any prior deployment, cache, RPC, or
        external-chain state.
      deprecated: true
      security: []
      parameters:
        - name: address
          in: path
          required: true
          description: >
            Route-shape segment only. Proxy hands off the canonical and
            `/api/v1` aliases only when it is lowercase `0x` followed by exactly
            40 hexadecimal characters; the handler does not read this value.
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
      responses:
        '410':
          description: Public EVM portfolio acquisition is not published in V1
          headers:
            Cache-Control:
              description: Prevents browser and shared-cache storage.
              schema:
                type: string
                example: private, no-store, max-age=0, must-revalidate
            CDN-Cache-Control:
              description: Prevents CDN storage.
              schema:
                type: string
                example: no-store
            Vercel-CDN-Cache-Control:
              description: Prevents Vercel CDN storage.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error, code]
                properties:
                  error:
                    type: string
                    enum: [Public outbound fetch is temporarily unavailable during V1 verification.]
                  code:
                    type: string
                    enum: [PUBLIC_EGRESS_NOT_PUBLISHED]

  /settings/export:
    post:
      tags: [Identity & Accounts]
      summary: Export the authenticated user's portable data
      description: >
        Produces a complete JSON download after owner authentication, double-submit
        CSRF validation, and a durable 24-hour cooldown. Legacy Portfolio data is
        supplied by a service-only RPC bound by the route to the authenticated
        user and is projected through exact field allowlists. The export includes
        metadata, positions, and snapshots but never user_id, API-key ciphertext,
        passphrase ciphertext, or future unapproved fields. Missing RPC/schema,
        any dataset read failure, unsafe shape, or child outside the owner's
        returned parent set fails the whole export; there is no partial-success
        fallback. Every outcome is private and non-cacheable.
      security:
        - bearerAuth: []
          csrfCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Complete portable JSON export download
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
            Content-Disposition:
              description: Date-based download filename that does not contain the user id.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [exportedAt, manifest, account]
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  manifest:
                    type: object
                    required: [schema_version, scope, consistency, datasets]
                    properties:
                      schema_version:
                        type: string
                        enum: ['1']
                      scope:
                        type: string
                        enum: [supported_portable_datasets]
                      consistency:
                        type: string
                        enum: [best_effort_keyset]
                      datasets:
                        type: array
                        items:
                          type: object
                          required: [name, status, row_count]
                          properties:
                            name:
                              type: string
                            status:
                              type: string
                              enum: [complete]
                            row_count:
                              type: integer
                              minimum: 0
                  account:
                    type: object
                    required: [legacy_portfolios]
                    properties:
                      legacy_portfolios:
                        $ref: '#/components/schemas/LegacyPortfolioExport'
                    additionalProperties: true
                additionalProperties: true
        '401':
          description: Authentication required
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '403':
          description: Missing or mismatched CSRF cookie/header
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '413':
          description: At least one dataset exceeds the synchronous 250,000-row limit
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '429':
          description: Route rate limit or durable 24-hour export cooldown exceeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '500':
          description: A complete safe export could not be assembled; no partial export is returned
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'
        '503':
          description: Authenticated profile provisioning is incomplete
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStoreCacheControl'

  /search:
    get:
      tags: [Search]
      summary: Unified Search
      description: >
        Searches across traders, posts, library items, users, and groups.
        Results are categorized and ranked by relevance. Cached for 5 minutes.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (min 1 character)
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          description: Max results per category
          schema:
            type: integer
            default: 5
            maximum: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      query:
                        type: string
                      results:
                        type: object
                        properties:
                          traders:
                            type: array
                            items:
                              $ref: '#/components/schemas/SearchResult'
                          posts:
                            type: array
                            items:
                              $ref: '#/components/schemas/SearchResult'
                          library:
                            type: array
                            items:
                              $ref: '#/components/schemas/SearchResult'
                          users:
                            type: array
                            items:
                              $ref: '#/components/schemas/SearchResult'
                          groups:
                            type: array
                            items:
                              $ref: '#/components/schemas/SearchResult'
                      total:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /follow:
    get:
      tags: [Follow]
      summary: Check Follow Status
      description: Check if the authenticated user follows a trader.
      security:
        - bearerAuth: []
      parameters:
        - name: traderId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Follow status
          content:
            application/json:
              schema:
                type: object
                properties:
                  following:
                    type: boolean
        '401':
          description: Unauthorized
    post:
      tags: [Follow]
      summary: Follow / Unfollow Trader
      description: Toggle follow state for a trader.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [traderId, action]
              properties:
                traderId:
                  type: string
                action:
                  type: string
                  enum: [follow, unfollow]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  following:
                    type: boolean
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '503':
          description: Follow feature not available

  /posts:
    get:
      tags: [Posts]
      summary: List Posts
      description: Community posts with optional filtering and sorting.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, hot_score, like_count]
            default: created_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: group_id
          in: query
          schema:
            type: string
            format: uuid
        - name: author_handle
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      posts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Post'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /groups:
    get:
      tags: [Groups]
      summary: List Groups
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          $ref: '#/components/schemas/Group'

components:
  headers:
    PrivateNoStoreCacheControl:
      description: Prevents browser and shared-cache storage; CDN-specific no-store headers are also emitted.
      schema:
        type: string
        example: private, no-store, max-age=0

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token
    csrfCookie:
      type: apiKey
      in: cookie
      name: csrf-token
      description: Double-submit CSRF cookie required by middleware-protected writes.
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Must exactly match the csrf-token cookie.

  responses:
    RetiredLegacyPortfolio:
      description: Legacy CEX Portfolio capability is unavailable in Arena V1
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStoreCacheControl'
        Link:
          description: Private account-connection successor relation.
          schema:
            type: string
            example: '</api/trader/authorize>; rel="successor-version"'
      content:
        application/json:
          schema:
            type: object
            required: [success, error, successor]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                type: string
              successor:
                type: string
                enum: [/api/trader/authorize]

    RetiredExchangeOAuth:
      description: Exchange OAuth is gone in V1; use /api/trader/authorize
      headers:
        Cache-Control:
          description: Prevents storage of the retirement response.
          schema:
            type: string
            example: private, no-store, max-age=0
        Link:
          description: Successor endpoint relation.
          schema:
            type: string
            example: '</api/trader/authorize>; rel="successor-version"'
      content:
        application/json:
          schema:
            type: object
            required: [success, error, successor]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                type: string
                example: Exchange OAuth is unavailable in Arena V1. Use read-only API key binding.
              successor:
                type: string
                enum: [/api/trader/authorize]

  schemas:
    LegacyPortfolioMetadata:
      type: object
      additionalProperties: false
      required: [id, exchange, label, created_at]
      properties:
        id:
          type: string
          format: uuid
        exchange:
          type: string
        label:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    LegacyPortfolioPositionExport:
      type: object
      additionalProperties: false
      required:
        - id
        - portfolio_id
        - symbol
        - side
        - entry_price
        - mark_price
        - size
        - pnl
        - pnl_pct
        - leverage
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        portfolio_id:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
        entry_price:
          type: string
        mark_price:
          type: string
        size:
          type: string
        pnl:
          type: string
        pnl_pct:
          type: string
        leverage:
          type: string
        updated_at:
          type: string
          format: date-time

    LegacyPortfolioSnapshotExport:
      type: object
      additionalProperties: false
      required:
        - id
        - portfolio_id
        - total_equity
        - total_pnl
        - total_pnl_pct
        - snapshot_at
      properties:
        id:
          type: string
          format: uuid
        portfolio_id:
          type: string
          format: uuid
        total_equity:
          type: string
        total_pnl:
          type: string
        total_pnl_pct:
          type: string
        snapshot_at:
          type: string
          format: date-time

    LegacyPortfolioExport:
      type: object
      additionalProperties: false
      required: [portfolios, positions, snapshots]
      properties:
        portfolios:
          type: array
          maxItems: 250000
          items:
            $ref: '#/components/schemas/LegacyPortfolioMetadata'
        positions:
          type: array
          maxItems: 250000
          items:
            $ref: '#/components/schemas/LegacyPortfolioPositionExport'
        snapshots:
          type: array
          maxItems: 250000
          items:
            $ref: '#/components/schemas/LegacyPortfolioSnapshotExport'

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [pass, fail, skip]
        latency:
          type: integer
          description: Latency in milliseconds
        message:
          type: string

    RankedTrader:
      type: object
      properties:
        platform:
          type: string
        trader_key:
          type: string
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        rank:
          type: integer
        metrics:
          type: object
          properties:
            roi:
              type: number
              nullable: true
            pnl:
              type: number
              nullable: true
            win_rate:
              type: number
              nullable: true
            max_drawdown:
              type: number
              nullable: true
            trades_count:
              type: integer
              nullable: true
            followers:
              type: integer
              nullable: true
            arena_score:
              type: number
              nullable: true
            sharpe_ratio:
              type: number
              nullable: true
        updated_at:
          type: string
          format: date-time
        is_bot:
          type: boolean
        trader_type:
          type: string
          nullable: true

    TraderListItem:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
          nullable: true
        roi:
          type: number
        pnl:
          type: number
          nullable: true
        win_rate:
          type: number
          nullable: true
        max_drawdown:
          type: number
          nullable: true
        trades_count:
          type: integer
          nullable: true
        followers:
          type: integer
          nullable: true
        source:
          type: string
        source_type:
          type: string
        avatar_url:
          type: string
          nullable: true
        arena_score:
          type: number
        rank:
          type: integer
        sharpe_ratio:
          type: number
          nullable: true
        is_bot:
          type: boolean
        trader_type:
          type: string
          nullable: true

    TraderProfile:
      type: object
      properties:
        platform:
          type: string
        market_type:
          type: string
        trader_key:
          type: string
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        profile_url:
          type: string
          nullable: true
        followers:
          type: integer
          nullable: true
        copiers:
          type: integer
          nullable: true
        aum:
          type: number
          nullable: true

    TraderSnapshot:
      type: object
      properties:
        window:
          type: string
        roi:
          type: number
          nullable: true
        pnl:
          type: number
          nullable: true
        win_rate:
          type: number
          nullable: true
        max_drawdown:
          type: number
          nullable: true
        trades_count:
          type: integer
          nullable: true
        arena_score:
          type: number
          nullable: true
        captured_at:
          type: string
          format: date-time

    SearchResult:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [trader, post, library, user, group]
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        href:
          type: string
        avatar:
          type: string
          nullable: true
        meta:
          type: object
          nullable: true

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        author_handle:
          type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        view_count:
          type: integer
        created_at:
          type: string
          format: date-time

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        member_count:
          type: integer
        post_count:
          type: integer

    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            timestamp:
              type: string
              format: date-time
